name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skill quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest JSON
        run: python3 -c "import json; json.load(open('manifest.json')); print('manifest.json OK')"
      - name: Run skill validator (must be 0 errors, 0 warnings)
        run: python3 tools/validate_skills.py
      - name: Assert pack/disk consistency
        run: |
          # 门禁已含 pack↔skills 双向一致性检查（orphan/ghost 都会 FAIL），
          # 这里只需防 validator 本身被绕过：再次确认退出码语义。
          python3 tools/validate_skills.py >/dev/null && echo "gate PASSED"

  build:
    name: Build packs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - name: Run build.py (pack -> dist zips + manifest sync)
        run: python3 build.py
      - name: Assert artifacts produced
        run: |
          test -d dist
          count=$(ls dist/*.zip 2>/dev/null | wc -l)
          echo "dist zips: $count"
          [ "$count" -gt 0 ]
      - name: Assert manifest covers every pack
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          packs = {p.parent.name for p in Path('packs').glob('*/pack.json')}
          manifest = {p['id'] for p in json.load(open('manifest.json'))['packs']}
          missing = packs - manifest
          assert not missing, f"manifest 缺包: {missing}"
          print(f"manifest 覆盖 {len(manifest)}/{len(packs)} 个包 OK")
          PY
      - name: Verify build reproducibility
        run: |
          sha_before=$(sha256sum dist/content-publishing.zip | cut -d' ' -f1)
          python3 build.py >/dev/null
          sha_after=$(sha256sum dist/content-publishing.zip | cut -d' ' -f1)
          echo "before=$sha_before after=$sha_after"
          [ "$sha_before" = "$sha_after" ] && echo "reproducible OK"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - name: Run all python file syntax checks
        run: |
          python3 - <<'PY'
          import py_compile
          from pathlib import Path
          bad = []
          for f in sorted(Path('.').rglob('*.py')):
              if '.git' in f.parts:
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          assert not bad, "语法错误:\n" + "\n".join(bad)
          print(f"全部 Python 文件语法 OK")
          PY
      - name: Run pytest suite (single source of truth, matches CONTRIBUTING.md)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest skills -q
        # 为什么不用"直接执行 test_*.py"：pytest 风格的测试文件（如
        # test_smoke_*.py 的 assert 函数）直接运行不会执行任何断言——
        # 退出码恒 0，等于空跑假绿。统一走 pytest 才能保证语义一致。
