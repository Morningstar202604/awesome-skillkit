name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skill quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest JSON
        run: python3 -c "import json; json.load(open('manifest.json')); print('manifest.json OK')"
      - name: Run skill validator (must be 0 errors, 0 warnings)
        run: python3 tools/validate_skills.py
      - name: Assert pack/disk consistency
        run: |
          # 门禁已含 pack↔skills 双向一致性检查（orphan/ghost 都会 FAIL），
          # 这里只需防 validator 本身被绕过：再次确认退出码语义。
          python3 tools/validate_skills.py >/dev/null && echo "gate PASSED"

  build:
    name: Build packs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - name: Run build.py (pack -> dist zips + manifest sync)
        run: python3 build.py
      - name: Assert artifacts produced
        run: |
          test -d dist
          count=$(ls dist/*.zip 2>/dev/null | wc -l)
          echo "dist zips: $count"
          [ "$count" -gt 0 ]
      - name: Assert manifest covers every pack
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          packs = {p.parent.name for p in Path('packs').glob('*/pack.json')}
          manifest = {p['id'] for p in json.load(open('manifest.json'))['packs']}
          missing = packs - manifest
          assert not missing, f"manifest 缺包: {missing}"
          print(f"manifest 覆盖 {len(manifest)}/{len(packs)} 个包 OK")
          PY
      - name: Verify build reproducibility
        run: |
          sha_before=$(sha256sum dist/content-publishing.zip | cut -d' ' -f1)
          python3 build.py >/dev/null
          sha_after=$(sha256sum dist/content-publishing.zip | cut -d' ' -f1)
          echo "before=$sha_before after=$sha_after"
          [ "$sha_before" = "$sha_after" ] && echo "reproducible OK"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@v7
      - name: Run all python file syntax checks
        run: |
          python3 - <<'PY'
          import py_compile
          from pathlib import Path
          bad = []
          for f in sorted(Path('.').rglob('*.py')):
              if '.git' in f.parts:
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
              except Exception as e:
                  bad.append(f"{f}: {e}")
          assert not bad, "语法错误:\n" + "\n".join(bad)
          print(f"全部 Python 文件语法 OK")
          PY
      - name: Run pytest suite (single source of truth, matches CONTRIBUTING.md)
        run: |
          # 测试依赖与技能脚本对齐：docx-writer→python-docx、pdf-pipeline→pypdf、
          # pub-plotter→matplotlib（test_all_scripts_import_cleanly 会真实导入脚本）。
          python3 -m pip install --quiet pytest==9.1.1 python-docx==1.2.0 pypdf==6.19.0 matplotlib==3.11.2
          python3 -m pytest skills -q
        # 为什么不用"直接执行 test_*.py"：pytest 风格的测试文件（如
        # test_smoke_*.py 的 assert 函数）直接运行不会执行任何断言——
        # 退出码恒 0，等于空跑假绿。统一走 pytest 才能保证语义一致。

  expert-teams:
    name: Expert Teams gate (expert-teams/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pyyaml (subtree verify.py dependency)
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: "Content gate (verify.py: structure / skill binding / effectiveness)"
        run: python3 expert-teams/verify.py
      - name: Unit tests (subtree)
        run: python3 -m unittest discover -s expert-teams/tests
      - name: Site data drift check (build-site.py --check)
        run: python3 expert-teams/build-site.py --check
      - name: Assert download digests match committed site/downloads
        run: |
          # 安装包是提交进仓库的产物（site/downloads/）：重建到 dist 后逐个比对摘要，
          # 防止子目录改动后忘记重新生成/提交（与 packs 的摘要门禁同思路）
          python3 expert-teams/export-platforms.py >/dev/null
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          built = sorted(Path("expert-teams/dist/zips").glob("*.zip"))
          committed = sorted(Path("site/downloads").glob("expert-teams-*.zip"))
          assert built, "未产出任何安装包 zip"
          assert len(built) == len(committed), (
              f"安装包数量不一致：built={len(built)} committed={len(committed)}"
          )
          drift = [
              p.name for p in built
              if hashlib.sha256(p.read_bytes()).hexdigest()
              != hashlib.sha256((Path("site/downloads") / p.name).read_bytes()).hexdigest()
          ]
          assert not drift, (
              "site/downloads 与构建产物摘要不一致（请重跑 export-platforms.py 后，"
              f"用 tools/build_site.py 同步并提交）：{drift}"
          )
          print(f"下载包摘要一致：{len(built)} 个")
          PY
