name: skill-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (skill toolchains)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run bundled test suites
        run: |
          python -m pytest skills/programming/ai-engineering/skill-tester/tests -q
          python -m pytest skills/programming/security/env-secrets-manager/tests -q
          python skills/life/family/chinese-parents-skill/scripts/test_profile.py
      - name: Build scene packs (catches missing skill dirs / pack.json drift)
        run: |
          python3 build.py dist_ci
          test -f dist_ci/_all.zip

  gates:
    name: Quality gates on changed skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Determine changed skill directories
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          DIRS=$(git diff --name-only "$BASE" HEAD -- skills | cut -d'/' -f1-4 | sort -u | grep -v '^$' || true)
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
      - name: Validate + gate each changed skill
        if: steps.changed.outputs.dirs != ''
        run: |
          FAIL=0
          for skill in ${{ steps.changed.outputs.dirs }}; do
            [ -f "$skill/SKILL.md" ] || continue
            echo "=== gating $skill ==="
            # every SKILL.md must have proper frontmatter (loadable by tools)
            python3 - "$skill" <<'PY'
import re, sys, pathlib
src = pathlib.Path(sys.argv[1], "SKILL.md").read_text(encoding="utf-8-sig")
sys.exit(0 if re.match(r"\A---\s*\n(.*?)\n---\s*\n", src, re.DOTALL) else 1)
PY
            [ $? -eq 0 ] || { echo "FAIL: $skill/SKILL.md has no YAML frontmatter"; FAIL=1; }
            # no dangling script references: every scripts/*.py mentioned in SKILL.md must exist
            python3 - "$skill" <<'PY'
import re, sys, pathlib
skill = pathlib.Path(sys.argv[1])
src = (skill / "SKILL.md").read_text(encoding="utf-8-sig")
missing = [m for m in re.findall(r"(?:scripts/|scripts\\\\)([\w.-]+\.py)", src)
           if not (skill / "scripts" / m).exists()]
if missing:
    print("FAIL: dangling script refs:", missing); sys.exit(1)
PY
            [ $? -eq 0 ] || FAIL=1
          done
          exit $FAIL
